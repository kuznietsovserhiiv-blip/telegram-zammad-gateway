services:
  gateway:
    build: .
    container_name: telegram-auth-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8090}:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

